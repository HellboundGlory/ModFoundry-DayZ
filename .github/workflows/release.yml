name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HOME: /root
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build packages
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential curl ca-certificates git pkg-config
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME gives $tag, but Cargo.toml has version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.98.1
      # Some tests lock a file with mode 000 and expect an error, which root never gets.
      - name: Test as a normal user
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE" "$CARGO_HOME" "$RUSTUP_HOME"
          su builder -c "PATH=$CARGO_HOME/bin:\$PATH cargo test --locked --workspace --no-fail-fast"
      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about@0.9.3
      - name: Build the release package
        run: bash packaging/linux/build-release.sh
      - name: Show glibc version and checksum
        run: |
          ldd --version | sed -n 1p
          cat dist/*.sha256
      - name: Run the packaged programs
        run: |
          mkdir -p /tmp/package
          tar -xzf dist/ModFoundry-*-linux-x86_64.tar.gz -C /tmp/package
          cd /tmp/package/ModFoundry-*-linux-x86_64
          printed="$(./mf --version)"
          if [[ "${printed##* }" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "the packaged mf says '$printed', not ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi
          ./modfoundry-mcp-server --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-package
          path: |
            dist/ModFoundry-*-linux-x86_64.tar.gz
            dist/ModFoundry-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-package
          path: dist
      - name: Check the downloaded files
        run: cd dist && sha256sum -c ./*.sha256
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing="$(gh release list --limit 100 --json tagName --jq ".[] | select(.tagName == \"$GITHUB_REF_NAME\") | .tagName")"
          if [[ -n "$existing" ]]; then
            echo "a release or draft for $GITHUB_REF_NAME already exists; delete it before running this again" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "ModFoundry ${GITHUB_REF_NAME#v}" \
            --notes "Draft for testing; the changelog is in CHANGELOG.md." \
            dist/ModFoundry-*-linux-x86_64.tar.gz \
            dist/ModFoundry-*-linux-x86_64.tar.gz.sha256
